<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 640" width="360" height="640" font-family="Helvetica, Arial, sans-serif" font-size="13">
<title>Game · Screen 2 · Board</title>
<rect x="0.5" y="0.5" width="359" height="639" fill="#fff" stroke="#444" rx="18"/>
<text x="16" y="24" font-size="11" fill="#888">WIREFRAME · Game · Screen 2 · Board · low fidelity, layout only</text>
<rect x="16" y="40" width="200" height="36" fill="#f3f3f3" stroke="#555"/><text x="116.0" y="62.9" text-anchor="middle" font-size="14" fill="#222">[ TITLE ]</text>
<rect x="228" y="40" width="116" height="36" fill="#f3f3f3" stroke="#555"/><text x="286.0" y="62.2" text-anchor="middle" font-size="12" fill="#222">[ Restart game ]</text>
<rect x="16" y="88" width="328" height="30" fill="#f3f3f3" stroke="#555"/><text x="180.0" y="107.2" text-anchor="middle" font-size="12" fill="#222">Status: Choose an empty square.</text>
<rect x="60" y="140" width="80" height="80" fill="#f3f3f3" stroke="#555"/><text x="100.0" y="184.9" text-anchor="middle" font-size="14" fill="#222">YOU</text>
<rect x="140" y="140" width="80" height="80" fill="#f3f3f3" stroke="#555"/><text x="180.0" y="184.2" text-anchor="middle" font-size="12" fill="#222">2</text>
<rect x="220" y="140" width="80" height="80" fill="#f3f3f3" stroke="#555"/><text x="260.0" y="184.9" text-anchor="middle" font-size="14" fill="#222">THEM</text>
<rect x="60" y="220" width="80" height="80" fill="#f3f3f3" stroke="#555"/><text x="100.0" y="264.2" text-anchor="middle" font-size="12" fill="#222">4</text>
<rect x="140" y="220" width="80" height="80" fill="#f3f3f3" stroke="#555"/><text x="180.0" y="264.9" text-anchor="middle" font-size="14" fill="#222">YOU</text>
<rect x="220" y="220" width="80" height="80" fill="#f3f3f3" stroke="#555"/><text x="260.0" y="264.2" text-anchor="middle" font-size="12" fill="#222">6</text>
<rect x="60" y="300" width="80" height="80" fill="#f3f3f3" stroke="#555"/><text x="100.0" y="344.2" text-anchor="middle" font-size="12" fill="#222">7</text>
<rect x="140" y="300" width="80" height="80" fill="#f3f3f3" stroke="#555"/><text x="180.0" y="344.2" text-anchor="middle" font-size="12" fill="#222">8</text>
<rect x="220" y="300" width="80" height="80" fill="#f3f3f3" stroke="#555"/><text x="260.0" y="344.2" text-anchor="middle" font-size="12" fill="#222">9</text>
<text x="16" y="420" font-size="11" fill="#555" text-anchor="start">Cells are buttons. At least 44px tall. Fit a 375px phone.</text>
<text x="16" y="436" font-size="11" fill="#555" text-anchor="start">Each mark also has a hidden X / O label for screen readers.</text>
<text x="16" y="480" font-size="12" fill="#888" text-anchor="start">When the board is finished:</text>
<rect x="16" y="490" width="328" height="34" fill="#f3f3f3" stroke="#555"/><text x="180.0" y="511.9" text-anchor="middle" font-size="14" fill="#222">You won! / They won / Draw</text>
<rect x="80" y="540" width="200" height="48" fill="#f3f3f3" stroke="#555"/><text x="180.0" y="569.25" text-anchor="middle" font-size="15" fill="#222">[ Play again ]</text>
</svg>